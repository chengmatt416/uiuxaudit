name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Verify & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Zero-Token Dependency Guardrail
        run: npm run audit-deps

      - name: Build Web, Extension, and Desktop Bundles
        run: |
          npm run build:web
          npm run build:ext
          npm run build:desktop

      - name: Install Chromium for Smoke Tests
        run: sudo apt-get update && sudo apt-get install -y chromium-browser

      - name: Run Core Test Suite
        run: |
          export UA_CHROMIUM=$(which chromium-browser || which chromium)
          npm run smoke:verify
          npm run smoke:loop
          npm run smoke:features
          npm run smoke:ui
          npm run smoke:pwa
          npm run smoke:ext
