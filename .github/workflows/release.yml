name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Web and Extensions
        run: |
          npm run build:web
          npm run build:ext
          (cd apps/web/dist && zip -qr ../../../uiuxaudit-pwa.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/extension/dist/chrome.zip
            apps/extension/dist/firefox.zip
            uiuxaudit-pwa.zip
          draft: false
          prerelease: false
          generate_release_notes: true
