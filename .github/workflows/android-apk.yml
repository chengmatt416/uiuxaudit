name: android-apk

# Builds the Capacitor Android shell around the PWA bundle.
# The APK cannot be compiled on-device (no Android SDK in the dev
# environment); CI is the supported build path.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: bash scripts/build-web.sh

      - name: Add Android platform
        run: npx cap add android && npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: uiuxaudit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
